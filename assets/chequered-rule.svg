<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 24" width="1280" height="24" role="img" aria-label="Chequered finish rule">
  <defs>
    <style>
      @keyframes drift { 0% { transform: translateX(0) } 100% { transform: translateX(-48px) } }
      .flag { animation: drift 2.6s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .flag { animation: none } }
    </style>
    <pattern id="chq" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect x="0"  y="0"  width="12" height="12" fill="#F5F5F7"/>
      <rect x="24" y="0"  width="12" height="12" fill="#F5F5F7"/>
      <rect x="12" y="12" width="12" height="12" fill="#F5F5F7"/>
      <rect x="36" y="12" width="12" height="12" fill="#F5F5F7"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#000" stop-opacity="1"/>
      <stop offset=".45" stop-color="#000" stop-opacity=".25"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect x="0" y="0" width="1280" height="24" fill="url(#fade)"/></mask>
    <clipPath id="c9"><rect x="0" y="0" width="1280" height="24"/></clipPath>
  </defs>

  <rect width="1280" height="24" fill="#0A0A0B"/>
  <g clip-path="url(#c9)" mask="url(#m)" opacity=".9">
    <rect class="flag" x="-48" y="0" width="1376" height="24" fill="url(#chq)"/>
  </g>
  <rect x="0" y="10" width="1280" height="1.5" fill="#26282E" opacity=".8"/>
  <rect x="0" y="0" width="6" height="24" fill="#E10600"/>
</svg>
