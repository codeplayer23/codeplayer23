    <rect x="8" y="8" width="4" height="44" fill="#FF8700"/>
    <text class="mono lbl" x="30" y="36" font-size="14" fill="#F5F5F7">06 · CURRENT SESSION</text>
    <text class="mono lbl" x="1244" y="35" font-size="12" fill="#8A8F98" text-anchor="end">4 IN DEVELOPMENT · 2 IN EVALUATION</text>
  </g>
  <rect x="8" y="8" width="1264" height="452" rx="10" fill="none" stroke="#26282E" stroke-width="1.5"/>

  <text class="mono" x="30" y="88" font-size="16" fill="#E10600">&gt;<tspan fill="#F5F5F7" dx="10">current_session --status</tspan><tspan class="cur" fill="#F5F5F7" dx="6">█</tspan></text>

