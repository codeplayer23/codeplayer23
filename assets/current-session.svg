<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 468" width="1280" height="468" role="img" aria-label="Current session status. In development: distributed AI systems, cloud-native processing, computer vision, transformer architectures. Under evaluation: model explainability, local LLM inference. Development means actively building; evaluation means exploring, not claimed as expertise.">
  <title>current_session --status</title>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { letter-spacing: 2px; }
      .area { font-size: 15px; fill: #F5F5F7; }
      .basis{ font-size: 12px; fill: #8A8F98; }
      .chip { font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }

      @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
      @keyframes led   { 0%, 100% { opacity: 1 } 50% { opacity: .22 } }
      .cur { animation: blink 1.05s steps(1) infinite; }
      .dev { animation: led 2.1s ease-in-out infinite; }
      .evl { animation: led 3.1s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cur, .dev, .evl { animation: none } }
    </style>
    <pattern id="g7" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32M0 32H32" fill="none" stroke="#26282E" stroke-width=".6" opacity=".4"/>
    </pattern>
    <clipPath id="c7"><rect x="8" y="8" width="1264" height="452" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="468" fill="#0A0A0B"/>
  <g clip-path="url(#c7)">
    <rect x="8" y="8" width="1264" height="452" fill="url(#g7)"/>
    <rect x="9" y="180" width="1262" height="46" fill="#121316" opacity=".85"/>
    <rect x="9" y="272" width="1262" height="46" fill="#121316" opacity=".85"/>
    <rect x="9" y="364" width="1262" height="46" fill="#121316" opacity=".85"/>
    <rect x="8" y="8" width="1264" height="44" fill="#121316"/>
