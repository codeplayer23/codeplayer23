<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 14" width="1280" height="14" role="img" aria-label="Section divider">
  <defs>
    <style>
      @keyframes slide { 0% { transform: translateX(-180px) } 100% { transform: translateX(1280px) } }
      .run { animation: slide 6.5s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: .35 } }
    </style>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E10600" stop-opacity="0"/>
      <stop offset=".55" stop-color="#E10600" stop-opacity=".95"/>
      <stop offset="1"   stop-color="#FF8700" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="1280" height="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <line x1="0" y1="7" x2="1280" y2="7" stroke="#26282E" stroke-width="2"/>
    <rect x="0"   y="4" width="54" height="6" fill="#E10600"/>
    <rect x="60"  y="4" width="14" height="6" fill="#FF8700"/>
    <rect x="80"  y="4" width="7"  height="6" fill="#FFD100"/>
    <rect class="run" x="0" y="5" width="180" height="4" fill="url(#pulse)"/>
  </g>
</svg>
