<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 306" width="1280" height="306" role="img" aria-label="Sector 1, language distribution measured across 19 public repositories totalling 223,582 bytes of source: Python 54.7 percent, HTML 15.3 percent, JavaScript 15.1 percent, Jupyter Notebook 9.4 percent, PHP 3.8 percent, CSS 1.6 percent, Dockerfile 0.2 percent.">
