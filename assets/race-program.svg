<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 528" width="1280" height="528" role="img" aria-label="Race program timing board. P1 cloud-native-text-engine, distributed AI and cloud, last stint 2026.05, running. P2 face_emotion_recognition, computer vision and ViT, 2025.11, running. P3 Transformer_Ensemble, NLP and transformers, 2025.10, classified. P4 CNN-LSTM-Attention-for-emotion-recognition, computer vision, 2025.10, classified. P5 DistilBERT_sentiment_analysis, NLP, 2025.10, classified. P6 rugas-orm-demo, full stack, 2025.06, classified. Plus 12 coursework test sessions.">
  <title>race_program --list</title>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { letter-spacing: 2px; }
      .pos  { font-size: 15px; font-weight: 700; fill: #E10600; letter-spacing: 1px; }
      .ent  { font-size: 15px; fill: #F5F5F7; }
      .cls  { font-size: 12px; fill: #8A8F98; letter-spacing: 1.5px; }
      .stt  { font-size: 12px; letter-spacing: 1.5px; }

      @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
      @keyframes led   { 0%, 100% { opacity: 1 } 50% { opacity: .18 } }
      .cur { animation: blink 1.05s steps(1) infinite; }
      .led { animation: led 1.7s ease-in-out infinite; }
      .l2  { animation-delay: .35s }
      @media (prefers-reduced-motion: reduce) { .cur, .led { animation: none } }
    </style>
    <pattern id="g4" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32M0 32H32" fill="none" stroke="#26282E" stroke-width=".6" opacity=".4"/>
    </pattern>
    <clipPath id="c4"><rect x="8" y="8" width="1264" height="512" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="528" fill="#0A0A0B"/>
  <g clip-path="url(#c4)">
    <rect x="8" y="8" width="1264" height="512" fill="url(#g4)"/>

    <!-- alternating rows -->
    <rect x="9"  y="142" width="1262" height="44" fill="#121316" opacity=".85"/>
    <rect x="9"  y="230" width="1262" height="44" fill="#121316" opacity=".85"/>
    <rect x="9"  y="318" width="1262" height="44" fill="#121316" opacity=".85"/>

    <rect x="8" y="8" width="1264" height="44" fill="#121316"/>
    <line x1="8" y1="52" x2="1272" y2="52" stroke="#26282E" stroke-width="1.5"/>
    <rect x="8" y="8" width="4" height="44" fill="#E10600"/>
    <text class="mono lbl" x="30" y="36" font-size="14" fill="#F5F5F7">04 · RACE PROGRAM</text>
    <text class="mono lbl" x="1244" y="35" font-size="12" fill="#8A8F98" text-anchor="end">6 ENTRIES + 12 TEST SESSIONS</text>
  </g>
  <rect x="8" y="8" width="1264" height="512" rx="10" fill="none" stroke="#26282E" stroke-width="1.5"/>

  <text class="mono" x="30" y="88" font-size="16" fill="#E10600">&gt;<tspan fill="#F5F5F7" dx="10">race_program --list</tspan><tspan class="cur" fill="#F5F5F7" dx="6">█</tspan></text>

  <!-- column headers -->
  <g class="mono lbl" font-size="11" fill="#8A8F98">
    <text x="34" y="126">POS</text>
    <text x="110" y="126">ENTRY</text>
    <text x="620" y="126">CLASSIFICATION</text>
    <text x="940" y="126">LAST STINT</text>
    <text x="1080" y="126">STATUS</text>
  </g>
  <line x1="30" y1="134" x2="1250" y2="134" stroke="#26282E" stroke-width="1.5"/>

  <g class="mono">
    <!-- P1 -->
    <text class="pos" x="34" y="170">P1</text>
    <text class="ent" x="110" y="170">cloud-native-text-engine</text>
    <text class="cls" x="620" y="170">DISTRIBUTED AI / CLOUD</text>
    <text class="cls" x="940" y="170">2026.05</text>
    <circle class="led" cx="1084" cy="165" r="4.5" fill="#E10600"/>
    <text class="stt" x="1098" y="170" fill="#E10600">RUNNING</text>

    <!-- P2 -->
    <text class="pos" x="34" y="214">P2</text>
    <text class="ent" x="110" y="214">face_emotion_recognition</text>
    <text class="cls" x="620" y="214">COMPUTER VISION / ViT</text>
    <text class="cls" x="940" y="214">2025.11</text>
    <circle class="led l2" cx="1084" cy="209" r="4.5" fill="#E10600"/>
    <text class="stt" x="1098" y="214" fill="#E10600">RUNNING</text>

    <!-- P3 -->
    <text class="pos" x="34" y="258">P3</text>
    <text class="ent" x="110" y="258">Transformer_Ensemble</text>
    <text class="cls" x="620" y="258">NLP / TRANSFORMERS</text>
    <text class="cls" x="940" y="258">2025.10</text>
    <text class="stt" x="1080" y="258" fill="#8A8F98">✓ CLASSIFIED</text>

    <!-- P4 -->
    <text class="pos" x="34" y="302">P4</text>
    <text class="ent" x="110" y="302">CNN-LSTM-Attention-for-emotion-recognition</text>
    <text class="cls" x="620" y="302">COMPUTER VISION</text>
    <text class="cls" x="940" y="302">2025.10</text>
    <text class="stt" x="1080" y="302" fill="#8A8F98">✓ CLASSIFIED</text>

    <!-- P5 -->
    <text class="pos" x="34" y="346">P5</text>
    <text class="ent" x="110" y="346">DistilBERT_sentiment_analysis</text>
    <text class="cls" x="620" y="346">NLP</text>
    <text class="cls" x="940" y="346">2025.10</text>
    <text class="stt" x="1080" y="346" fill="#8A8F98">✓ CLASSIFIED</text>

    <!-- P6 -->
    <text class="pos" x="34" y="390">P6</text>
    <text class="ent" x="110" y="390">rugas-orm-demo</text>
    <text class="cls" x="620" y="390">FULL STACK</text>
    <text class="cls" x="940" y="390">2025.06</text>
    <text class="stt" x="1080" y="390" fill="#8A8F98">✓ CLASSIFIED</text>
  </g>

  <line x1="30" y1="412" x2="1250" y2="412" stroke="#26282E" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- test sessions aggregate -->
  <g class="mono">
    <text class="pos" x="34" y="446" fill="#8A8F98">··</text>
    <text class="ent" x="110" y="446" fill="#8A8F98">TEST SESSIONS — ml_lab1–10 · nlp_lab · dlnn_lab1</text>
    <text class="cls" x="620" y="446">COURSEWORK / EXPERIMENTS</text>
    <text class="cls" x="940" y="446">2025.07–10</text>
    <text class="stt" x="1080" y="446" fill="#8A8F98">12 LOGGED</text>
  </g>

  <line x1="30" y1="472" x2="1250" y2="472" stroke="#26282E" stroke-width="1.5"/>
  <g class="mono lbl" font-size="11" fill="#8A8F98">
    <text x="30" y="498">● RUNNING = ACTIVE DEVELOPMENT</text>
    <text x="420" y="498">✓ CLASSIFIED = COMPLETE · RESULTS PUBLISHED</text>
  </g>
</svg>
