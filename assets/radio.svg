<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Radio channel panel. Pit wall messages: open to contributions, internships and collaborations; all repositories are public and issues and pull requests are welcome. Channel GitHub, codeplayer23, open. No other channels provisioned.">
  <title>radio --open</title>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { letter-spacing: 2px; }
      .msg  { font-size: 14px; fill: #F5F5F7; }
      .tag  { font-size: 11px; fill: #E10600; letter-spacing: 1.5px; font-weight: 700; }

      @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
      @keyframes led   { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }
      @keyframes wave  { 0%, 100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
      .cur { animation: blink 1.05s steps(1) infinite; }
      .led { animation: led 1.8s ease-in-out infinite; }
      .w   { transform-box: fill-box; transform-origin: bottom; animation: wave 1.1s ease-in-out infinite; }
      .w2  { animation-delay: .14s } .w3 { animation-delay: .28s }
      .w4  { animation-delay: .42s } .w5 { animation-delay: .56s }
      @media (prefers-reduced-motion: reduce) { .cur, .led, .w { animation: none } }
    </style>
    <pattern id="g8" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32M0 32H32" fill="none" stroke="#26282E" stroke-width=".6" opacity=".4"/>
    </pattern>
    <clipPath id="c8"><rect x="8" y="8" width="1264" height="304" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="#0A0A0B"/>
  <g clip-path="url(#c8)">
    <rect x="8" y="8" width="1264" height="304" fill="url(#g8)"/>
    <rect x="8" y="8" width="1264" height="44" fill="#121316"/>
    <line x1="8" y1="52" x2="1272" y2="52" stroke="#26282E" stroke-width="1.5"/>
    <rect x="8" y="8" width="4" height="44" fill="#E10600"/>
    <text class="mono lbl" x="30" y="36" font-size="14" fill="#F5F5F7">07 · RADIO</text>

    <!-- audio level meter -->
    <g fill="#E10600">
      <rect class="w"    x="1146" y="22" width="3" height="16" rx="1"/>
      <rect class="w w2" x="1154" y="22" width="3" height="16" rx="1"/>
      <rect class="w w3" x="1162" y="22" width="3" height="16" rx="1"/>
      <rect class="w w4" x="1170" y="22" width="3" height="16" rx="1"/>
      <rect class="w w5" x="1178" y="22" width="3" height="16" rx="1"/>
    </g>
    <text class="mono lbl" x="1244" y="35" font-size="12" fill="#8A8F98" text-anchor="end">CH 23</text>
  </g>
  <rect x="8" y="8" width="1264" height="304" rx="10" fill="none" stroke="#26282E" stroke-width="1.5"/>

  <text class="mono" x="30" y="88" font-size="16" fill="#E10600">&gt;<tspan fill="#F5F5F7" dx="10">radio --open</tspan><tspan class="cur" fill="#F5F5F7" dx="6">█</tspan></text>

  <line x1="30" y1="108" x2="1250" y2="108" stroke="#26282E" stroke-width="1.5"/>

  <g class="mono">
    <text class="tag"  x="40" y="142">[ PIT WALL ]</text>
    <text class="msg" x="180" y="142">Open to contributions, internships and collaborations.</text>
    <text class="tag"  x="40" y="176">[ PIT WALL ]</text>
    <text class="msg" x="180" y="176">All repositories are public — issues and pull requests welcome.</text>
  </g>

  <line x1="30" y1="204" x2="1250" y2="204" stroke="#26282E" stroke-width="1.5"/>

  <g class="mono lbl" font-size="11" fill="#8A8F98">
    <text x="40" y="234">CHANNEL</text>
    <text x="300" y="234">ADDRESS</text>
    <text x="1000" y="234">STATUS</text>
  </g>

  <text class="mono" x="40" y="268" font-size="15" fill="#F5F5F7">GITHUB</text>
  <text class="mono" x="300" y="268" font-size="15" fill="#F5F5F7">github.com/codeplayer23</text>
  <circle class="led" cx="1004" cy="263" r="4.5" fill="#E10600"/>
  <text class="mono" x="1018" y="268" font-size="12" fill="#E10600" letter-spacing="1.5">OPEN</text>

  <line x1="30" y1="286" x2="1250" y2="286" stroke="#26282E" stroke-width="1.5"/>
  <text class="mono lbl" x="30" y="306" font-size="11" fill="#8A8F98">NO OTHER CHANNELS PROVISIONED</text>
</svg>
