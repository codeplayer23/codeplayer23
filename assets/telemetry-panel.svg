<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 364" width="1280" height="364" role="img" aria-label="Telemetry panel. Public repositories 20. Account since 8 December 2023. Primary language Python. Discipline AI, ML and deep learning. Session status building. Repository classification: applied ML and DL 5, full stack 2, test sessions 12, infrastructure 1.">
  <title>telemetry --verbose</title>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl  { letter-spacing: 2px; }

      @keyframes blink { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
      @keyframes led   { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }
      @keyframes f1 { 0% { stroke-dashoffset: 125 } 55%, 100% { stroke-dashoffset: 0 } }
      @keyframes f2 { 0% { stroke-dashoffset: 50 }  55%, 100% { stroke-dashoffset: 0 } }
      @keyframes f3 { 0% { stroke-dashoffset: 300 } 55%, 100% { stroke-dashoffset: 0 } }
      @keyframes f4 { 0% { stroke-dashoffset: 25 }  55%, 100% { stroke-dashoffset: 0 } }

      .cur { animation: blink 1.05s steps(1) infinite; }
      .led { animation: led 1.9s ease-in-out infinite; }
      .b1 { stroke-dasharray: 125; animation: f1 4s ease-out infinite; }
      .b2 { stroke-dasharray: 50;  animation: f2 4s ease-out infinite .15s; }
      .b3 { stroke-dasharray: 300; animation: f3 4s ease-out infinite .3s; }
      .b4 { stroke-dasharray: 25;  animation: f4 4s ease-out infinite .45s; }

      @media (prefers-reduced-motion: reduce) {
        .cur, .led { animation: none }
        .b1, .b2, .b3, .b4 { animation: none; stroke-dashoffset: 0 }
      }
    </style>
    <pattern id="g2" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32M0 32H32" fill="none" stroke="#26282E" stroke-width=".6" opacity=".5"/>
    </pattern>
    <clipPath id="c2"><rect x="8" y="8" width="1264" height="348" rx="10"/></clipPath>
  </defs>

  <rect width="1280" height="364" fill="#0A0A0B"/>
